<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">DevNexus favicon</title>
  <desc id="desc">Square DevNexus icon with a black border and white diffusion glow around neon lime and cobalt code brackets and a connected-node symbol.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4ff24" />
      <stop offset="1" stop-color="#1558c9" />
    </linearGradient>
    <filter id="white-diffusion" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#ffffff" flood-opacity="0.4" />
    </filter>
  </defs>  
  <g transform="translate(10 18)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#white-diffusion)">
    <path d="M70 25 20 85l50 60" stroke="#d4ff24" stroke-width="16" />
    <path d="M150 25 200 85l-50 60" stroke="#1558c9" stroke-width="16" />
    <path d="M86 56h48M86 114h48" stroke="#e5e7eb" stroke-width="11" />
    <circle cx="110" cy="85" r="17" fill="url(#accent)" stroke="none" />
    <path d="M35 170c40 18 108 18 150-4" stroke="url(#accent)" stroke-width="7" />
  </g>
</svg>